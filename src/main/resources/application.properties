spring.application.name=Investview-API
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.config.import=optional:file:.env[.properties]

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

app.security.username=${APP_SECURITY_USERNAME}
app.security.password=${APP_SECURITY_PASSWORD}
app.security.admin-emails=${APP_SECURITY_ADMIN_EMAILS:}

app.oauth.google.issuer=${GOOGLE_ISSUER:https://accounts.google.com}
app.oauth.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
