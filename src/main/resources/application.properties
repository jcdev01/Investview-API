spring.application.name=Investview-API
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.config.import=optional:file:.env[.properties]

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

app.security.username=${APP_SECURITY_USERNAME}
app.security.password=${APP_SECURITY_PASSWORD}
app.security.admin-emails=${APP_SECURITY_ADMIN_EMAILS:}

app.oauth.google.issuer=${APP_OAUTH_GOOGLE_ISSUER}
app.oauth.google.jwk-set-uri=${APP_OAUTH_GOOGLE_JWK_SET_URI}
app.oauth.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID}

app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-32-bytes}
app.jwt.issuer=${APP_JWT_ISSUER:investview-api}
app.jwt.ttl=${APP_JWT_TTL:PT1H}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
