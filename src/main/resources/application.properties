spring.application.name=Investview-API

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/investview}
spring.datasource.username=${DB_USERNAME:investview}
spring.datasource.password=${DB_PASSWORD:investview}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:admin}
